[package]
name = "pious-setup"
version = "1.0.0"
edition = "2024"
description = "Installs, updates and uninstalls Pious."
license = "MIT"

[[bin]]
name = "pious-setup"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# ureq (blocking, rustls) rather than reqwest: no async runtime, far fewer
# dependencies, and the installer only needs plain streaming GETs.
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"
rfd = "0.17"
dirs = "6"
window-vibrancy = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
incremental = false
